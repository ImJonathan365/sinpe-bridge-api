# fly.toml app configuration file generated for sinpe-bridge-api on 2026-08-06T05:17:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sinpe-bridge-api'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[metrics]]
  port = 9091
  path = '/metrics'
